  (function () {

    /* ---------- Helfer: Skyline mit Fenstern ---------- */
    function skyline(g, opt) {
      const r = E.rng(opt.seed);
      const lights = opt.lightsInto || g;
      let x = opt.x0 || 0;
      const out = [];
      while (x < (opt.x1 || 1080)) {
        const w = opt.wMin + r() * (opt.wMax - opt.wMin);
        const h = opt.hMin + r() * (opt.hMax - opt.hMin);
        const y = opt.base - h;
        svg("rect", { x, y, width: w, height: h + 4, fill: opt.fill }, g);
        if (opt.windows) {
          const cw = opt.win, gap = opt.win * 0.8;
          for (let wy = y + gap; wy < opt.base - cw; wy += cw + gap)
            for (let wx = x + gap; wx < x + w - cw; wx += cw + gap)
              if (r() < opt.lit) out.push(svg("rect", { x: wx, y: wy, width: cw, height: cw * 1.2, fill: r() < 0.85 ? opt.litColor : "#ff8a5c" }, lights));
        }
        x += w + (opt.gap || 0);
      }
      return out;
    }

    /* ================= S1 ================= */

    const clock = $("#s1-clock .body");
    tl.fromTo(clock, { rotation: -10, svgOrigin: "0 0" }, { rotation: 10, duration: 0.08, repeat: 37, yoyo: true, ease: "none", svgOrigin: "0 0" }, 0);
    tl.fromTo("#s1-clock .ring-lines", { opacity: 0.2 }, { opacity: 1, duration: 0.16, repeat: 18, yoyo: true, ease: "none" }, 0);
    tl.fromTo("#s1-kid", { y: 30 }, { y: 0, duration: 0.35, ease: "back.out(3)" }, 0.2);
    tl.fromTo("#s1 .title.main", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 0.15);
    tl.fromTo("#s1 .title.sub", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.75);

    /* ================= S3 ================= */

      const g = $("#s3-shelves"), r = E.rng(21);

      const f = $("#s3-floor");
      for (let i = -8; i <= 8; i++) svg("line", { x1: 540 + i * 70, y1: 1040, x2: 540 + i * 260, y2: 1920 }, f);
      for (let k = 0; k < 7; k++) { const y = 1040 + Math.pow(k / 6, 1.6) * 880; svg("line", { x1: 0, y1: y, x2: 1080, y2: y }, f); }
      const W = $("#s3-walkers");
      const walkers = [
        { y: 1880, s: 0.78, arms: "box", shirt: "#7a4a9a", hair: "#2b1d14", from: -200, to: 1300, t: at("nehmen", -0.2), d: 3.2 },
        { y: 1760, s: 0.62, arms: "bag", shirt: "#2f7a8a", hair: "#c48a3a", from: 1280, to: -220, t: at("nehmen", 0.3), d: 3.2, flip: true },
        { y: 1700, s: 0.52, arms: "box", shirt: "#8a3a3a", hair: "#1b1b1b", from: -180, to: 1260, t: at("nehmen", 1.0), d: 3.0 },
      ];
      walkers.forEach((w, i) => {
        const wrap = svg("g", {}, W);
        const bob = svg("g", {}, wrap);
        E.person(bob, { x: 0, y: w.y, s: w.s, face: "worried", arms: w.arms, shirt: w.shirt, hair: w.hair, flip: w.flip });
        tl.fromTo(wrap, { x: w.from }, { x: w.to, duration: w.d, ease: "none" }, w.t);
        tl.fromTo(bob, { y: 0 }, { y: -14, duration: 0.18, repeat: Math.floor(w.d / 0.18), yoyo: true, ease: "sine.inOut" }, w.t);

      tl.fromTo("#s3-q", { autoAlpha: 0, scale: 0, svgOrigin: "840 970" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, at("kasse", 0.9));

    /* ================= S4 ================= */
    (function () {
      const h = $("#s4-hills");
      svg("path", { d: "M0,880 Q200,780 380,840 Q560,760 760,830 Q920,780 1080,840 L1080,900 L0,900Z", fill: "#2a2546" }, h);
      const d = $("#s4-dash");
      for (let k = 0; k < 9; k++) {
        const p0 = Math.pow(k / 9, 2), p1 = Math.pow((k + 0.45) / 9, 2);
        const y0 = 880 + p0 * 1040, y1 = 880 + p1 * 1040, w0 = 3 + p0 * 26, w1 = 3 + p1 * 26;
        svg("path", { d: `M${540 - w0 / 2},${y0} L${540 + w0 / 2},${y0} L${540 + w1 / 2},${y1} L${540 - w1 / 2},${y1}Z` }, d);

      const T = $("#s4-trucks");
      [["#3e8ad6", 640, 1000, 0.28], ["#3ee08f", 420, 1060, 0.36], ["#e8463c", 760, 1240, 0.62], ["#ffd23f", 300, 1660, 1.05]].forEach(([c, x, y, s]) => {

        g.setAttribute("style", "--brand:" + c);

      tl.fromTo("#s4-trucks", { y: 0 }, { y: 0, duration: 0.01 }, at("tag2"));
    })();

    /* ================= S4b ================= */
    (function () {
      const items = $("#s4b-items"), boards = $("#s4b-boards"), r = E.rng(5);
      const cols = ["#e8463c", "#ffd23f", "#3ee08f", "#6c8cff", "#f08a4b", "#e9e6f5", "#c26bff", "#3fd4ff"];
      const all = [];
      for (let row = 0; row < 4; row++) {
        const by = 680 + row * 300;
        let x = 70;
        while (x < 990) {
          const kind = r(), w = kind < 0.5 ? 90 : 70, h = kind < 0.5 ? 170 + r() * 50 : 200 + r() * 40;
          if (x + w > 1010) break;
          const g = svg("g", {}, items);
          const c = cols[Math.floor(r() * cols.length)];
          if (kind < 0.5) {
            svg("rect", { x, y: by - h, width: w, height: h, rx: 8, fill: c }, g);
            svg("rect", { x: x + 10, y: by - h + 40, width: w - 20, height: 50, rx: 6, fill: "rgba(255,255,255,.75)" }, g);
          } else {
            svg("rect", { x: x + 18, y: by - h, width: w - 36, height: 40, rx: 6, fill: "#e9e6f5" }, g);
            svg("rect", { x, y: by - h + 34, width: w, height: h - 34, rx: 22, fill: c }, g);
            svg("rect", { x: x + 8, y: by - h + 90, width: w - 16, height: 44, rx: 6, fill: "rgba(255,255,255,.7)" }, g);
          }
          all.push({ g, cx: x + w / 2, cy: by });
          x += w + 14;

        svg("rect", { x: 40, y: by, width: 1000, height: 30, fill: "#6d6a9a" }, boards);
        svg("rect", { x: 40, y: by + 30, width: 1000, height: 12, fill: "#1a1830" }, boards);

      }
      const order = all.map((a, i) => ({ a, k: r() })).sort((p, q) => p.k - q.k).map((p) => p.a);
      const t0 = at("regale", 0.0), span = end("regale") - t0 - 0.4;
      order.forEach((it, i) => tl.to(it.g, { scale: 0, autoAlpha: 0, svgOrigin: `${it.cx} ${it.cy}`, duration: 0.18, ease: "back.in(2)" }, t0 + (i / order.length) * span));
      tl.fromTo("#s4b-sign", { autoAlpha: 0, scale: 2.2, svgOrigin: "540 1000" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2)", svgOrigin: "540 1000" }, end("regale", -0.35));
    })();

    /* ================= S5 ================= */
    (function () {
      const lights = skyline($("#s5-city"), { seed: 42, base: 1390, wMin: 90, wMax: 170, hMin: 260, hMax: 880, fill: "#1b1838", gap: 6, windows: true, win: 16, lit: 0.55, litColor: "#ffd27a", lightsInto: $("#s5-lights") });

      const st = $("#s5-steam"), r = E.rng(9);
      const puffs = [];
      [[200, 1150, 1.0], [470, 1270, 0.8]].forEach(([x, y, s]) => {
        for (let i = 0; i < 6; i++) {
          const c = svg("circle", { cx: x + (r() - 0.5) * 120 * s, cy: y - i * 70 * s, r: (60 + r() * 40) * s, opacity: 0.85 - i * 0.12 }, st);
          puffs.push(c);

      });
      const lamps = $("#s5-lamps");
      [120, 380, 640, 900].forEach((x) => {
        svg("rect", { x: x - 5, y: 1500, width: 10, height: 300, fill: "#2c2948" }, lamps);
        svg("rect", { x: x - 40, y: 1494, width: 80, height: 14, rx: 7, fill: "#2c2948" }, lamps);
        svg("ellipse", { class: "lamp", cx: x + 28, cy: 1516, rx: 18, ry: 8, fill: "#ffe7a3" }, lamps);
        svg("path", { class: "lamp", d: `M${x + 12},1516 L${x - 60},1800 L${x + 116},1800 L${x + 44},1516Z`, fill: "#ffe7a3", opacity: 0.12 }, lamps);
      });
      tl.fromTo("#s5-zoom", { scale: 1.18, svgOrigin: "540 1100" }, { scale: 1.08, duration: end("kraft") - at("tag3"), ease: "none", svgOrigin: "540 1100" }, at("tag3", -0.2));

      tl.to(puffs, { autoAlpha: 0, scale: 0.4, duration: 0.6, stagger: 0.08, ease: "power2.in" }, at("kraft", 0.8));
      // Flackern (deterministische Abfolge)
      const fl = [1, 0.15, 0.9, 0.05, 0.7, 0.25, 1, 0.0, 0.5, 0.1, 0.8, 0.05];
      const t0 = at("flacker"), dt = (at("weg") - t0) / fl.length;
      fl.forEach((v, i) => { tl.set("#s5-lights", { opacity: v }, t0 + i * dt); tl.set(".lamp", { opacity: v }, t0 + i * dt); tl.set("#s5-skyglow", { opacity: v }, t0 + i * dt); });
      tl.set("#s5-lights", { opacity: 0 }, at("weg")); tl.set(".lamp", { opacity: 0 }, at("weg")); tl.set("#s5-skyglow", { opacity: 0 }, at("weg"));
      tl.fromTo("#s5-dark", { opacity: 0 }, { opacity: 0.45, duration: 0.2 }, at("weg"));
      tl.fromTo("#s5 .cam", { x: -14 }, { x: 0, duration: 0.05, repeat: 7, yoyo: true, ease: "none", immediateRender: false }, at("weg"));
      tl.to("#s5-zoom", { scale: 0.96, duration: 1.4, ease: "power2.inOut", svgOrigin: "540 1100" }, at("stadt", -0.1));
    })();

    /* ================= S6 ================= */
    (function () {
      const g = $("#s6-tiles");
      for (let y = 0; y < 1000; y += 120) svg("line", { x1: 0, y1: y, x2: 1080, y2: y }, g);

      tl.fromTo("#s6-hand", { x: 360, y: 520 }, { x: 0, y: 0, duration: 0.5, ease: "power3.out" }, at("hahn", -0.1));
      tl.fromTo("#s6-handle", { rotation: 0, svgOrigin: "620 830" }, { rotation: -55, duration: 0.5, ease: "power2.inOut", svgOrigin: "620 830" }, at("hahn", 0.3));
      tl.set("#s6-drop", { autoAlpha: 0 }, 0);
      tl.fromTo("#s6-drop", { autoAlpha: 1, scale: 0.2, y: 0, svgOrigin: "760 712" }, { scale: 1, duration: 0.6, ease: "power1.out", svgOrigin: "760 712" }, at("hahn", 0.3));
      tl.to("#s6-drop", { y: 330, duration: 0.35, ease: "power2.in" }, at("hahn", 0.9));
      tl.set("#s6-drop", { autoAlpha: 0 }, at("hahn", 1.25));
      tl.set("#s6-splash", { autoAlpha: 0 }, 0);
      tl.fromTo("#s6-splash", { autoAlpha: 1, y: 0, scale: 0.5, svgOrigin: "760 1066" }, { y: -30, scale: 1.4, autoAlpha: 0, duration: 0.4, ease: "power2.out", svgOrigin: "760 1066" }, at("hahn", 1.25));
    })();

    /* ================= S6b ================= */
    tl.fromTo("#s6b-card", { scale: 0.6, autoAlpha: 0, svgOrigin: "0 40" }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.4)" }, at("handy", 0.5));
    tl.fromTo("#s6b-bars", { x: -6 }, { x: 6, duration: 0.05, repeat: 9, yoyo: true, ease: "none" }, at("handy", 0.9));

    /* ================= S7 ================= */
    (function () {
      const H = $("#s7-houses"), r = E.rng(77);
      let x = -20;
      ["#5a4f60", "#6b5d55", "#4f4d63", "#665a5a", "#575468"].forEach((c, i) => {
        const w = 230, h = 520 + r() * 220, y = 1160 - h;
        svg("rect", { x, y, width: w, height: h, fill: c }, H);
        svg("rect", { x: x - 8, y: y - 20, width: w + 16, height: 26, fill: "rgba(0,0,0,.25)" }, H);
        for (let wy = y + 50; wy < 1080; wy += 140) for (let wx = x + 34; wx < x + w - 60; wx += 90) svg("rect", { x: wx, y: wy, width: 56, height: 80, rx: 4, fill: "#2c2a36" }, H);
        x += w;
      });
      const B = $("#s7-bins");
      [[160, 1400], [880, 1400]].forEach(([bx, by]) => {
        svg("rect", { x: bx - 80, y: by - 230, width: 160, height: 230, rx: 10, fill: "#2f6b4f" }, B);
        svg("rect", { x: bx - 92, y: by - 250, width: 184, height: 30, rx: 8, fill: "#25573f", transform: `rotate(-14 ${bx} ${by - 240})` }, B);
      });
      const G = $("#s7-bags");
      const spots = [];
      for (let i = 0; i < 26; i++) {
        const row = Math.floor(i / 7);
        const bx = 80 + (i % 7) * 150 + (row % 2) * 70 + (r() - 0.5) * 40;
        const by = 1520 - row * 95 + (r() - 0.5) * 20;
        spots.push([bx, by, 0.9 + r() * 0.5, (r() - 0.5) * 30]);
      }
      const t0 = at("tag7", -0.2), span = end("muell") - t0;
      spots.forEach(([bx, by, s, rot], i) => {
        const g = E.use(G, "bag", bx, by, s);
        g.setAttribute("transform", `translate(${bx},${by}) scale(${s}) rotate(${rot})`);
        const wrap = svg("g", {}, G); wrap.appendChild(g);
        tl.fromTo(wrap, { scale: 0, autoAlpha: 0, svgOrigin: `${bx} ${by}` }, { scale: 1, autoAlpha: 1, duration: 0.2, ease: "back.out(2.6)", svgOrigin: `${bx} ${by}` }, t0 + (i / spots.length) * span * 0.9);
      });
      const S = $("#s7-stink");
      [[260, 1250], [540, 1180], [820, 1250]].forEach(([sx, sy], i) => {
        const p = svg("path", { d: `M${sx},${sy} q-30,-40 0,-80 q30,-40 0,-80 q-30,-40 0,-80` }, S);
        tl.fromTo(p, { y: 30, autoAlpha: 0 }, { y: -40, autoAlpha: 1, duration: 1.2, repeat: 3, ease: "sine.inOut" }, at("muell", 0.3 + i * 0.25));
      });
      const F = $("#s7-flies");
      [[300, 1150], [700, 1120], [520, 1240]].forEach(([fx, fy], i) => {
        const swarm = svg("g", {}, F);
        for (let k = 0; k < 5; k++) svg("circle", { cx: fx + Math.cos(k * 1.3) * 45, cy: fy + Math.sin(k * 1.7) * 30, r: 6 }, swarm);
        tl.fromTo(swarm, { rotation: 0, svgOrigin: `${fx} ${fy}` }, { rotation: 360 * (i % 2 ? -1 : 1), duration: 1.6, repeat: 3, ease: "none", svgOrigin: `${fx} ${fy}` }, at("tag7"));
      });
      const R = $("#s7-rats");
      [[1700, 1.1, 0], [1830, 0.9, 0.25], [1600, 0.7, 0.5]].forEach(([ry, s, dl]) => {
        const wrap = svg("g", {}, R);
        E.use(wrap, "rat", 0, ry, s);
        tl.fromTo(wrap, { x: -260 }, { x: 1300, duration: 1.3, ease: "none" }, at("ratten", -0.2 + dl));
      });
    })();

    /* ================= S8 ================= */
    (function () {
      const rays = $("#s8-rays");
      for (let i = 0; i < 12; i++) svg("path", { d: "M540,800 L500,-400 L580,-400Z", transform: `rotate(${i * 30} 540 800)` }, rays);
      tl.fromTo("#s8-rays", { rotation: 0, svgOrigin: "540 800" }, { rotation: 25, duration: 2.5, ease: "none", svgOrigin: "540 800" }, at("verrueckt", -0.2));
      E.person($("#s8-kid"), { x: 540, y: 2350, s: 2.6, face: "smirk", arms: "down" });
      tl.fromTo("#s8-kid", { y: 200 }, { y: 0, duration: 0.4, ease: "back.out(2)" }, at("verrueckt", -0.2));
    })();

    /* ================= S8b ================= */
    (function () {
      const W = $("#s8b-win"), r = E.rng(13);
      const wins = [];
      for (let row = 0; row < 4; row++) for (let col = 0; col < 6; col++)
        wins.push(svg("rect", { x: 190 + col * 122, y: 480 + row * 112, width: 80, height: 74, rx: 6, fill: "#ffe7a3", opacity: 0.12 }, W));
      const order = wins.map((w) => ({ w, k: r() })).sort((a, b) => a.k - b.k).map((x) => x.w);
      const t0 = at("woche", 0.4);
      order.forEach((w, i) => tl.to(w, { opacity: 0.95, duration: 0.12 }, t0 + i * 0.12));
      tl.fromTo("#s8b-sun", { y: 260 }, { y: 0, duration: 4.4, ease: "power1.out" }, at("woche", -0.1));
      tl.fromTo("#s8b-sign", { scale: 0, svgOrigin: "540 880" }, { scale: 1, duration: 0.35, ease: "back.out(3)", svgOrigin: "540 880" }, at("woche", 1.8));
      const C = $("#s8b-crowd");
      const shirts = ["#e8463c", "#3fd4ff", "#3ee08f", "#ffd23f", "#c26bff", "#f08a4b", "#6c8cff", "#e9e6f5"];
      const hairs = ["#5b3a22", "#1b1b1b", "#c48a3a", "#7a2e1e"];
      for (let i = 0; i < 8; i++) {
        const lane = i % 4;
        const sx = i < 4 ? -120 - lane * 90 : 1200 + lane * 90;
        const fy = 1890 - lane * 130, s = 0.56 - lane * 0.07;
        const wrap = svg("g", {}, C); const bob = svg("g", {}, wrap);
        E.person(bob, { x: 0, y: fy, s, face: "neutral", arms: "down", shirt: shirts[i], hair: hairs[i % 4], flip: i >= 4 });
        const tx = 540 + (i < 4 ? -1 : 1) * [330, 235, 150, 80][lane];
        tl.fromTo(wrap, { x: sx }, { x: tx, duration: 3.4, ease: "power1.out" }, at("woche", 0.2 + lane * 0.15));
        tl.fromTo(bob, { y: 0 }, { y: -10, duration: 0.2, repeat: 15, yoyo: true, ease: "sine.inOut" }, at("woche", 0.2 + lane * 0.15));
      }
    })();

    /* ================= S9 ================= */
    (function () {
      const st = $("#s9-stars"), r = E.rng(99);
      for (let i = 0; i < 70; i++) svg("circle", { cx: r() * 1080, cy: r() * 1920, r: 1 + r() * 2.5, opacity: 0.2 + r() * 0.5 }, st);
      const t0 = at("durch", -0.3);
      tl.fromTo("#s9 .q", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, t0 + 0.05);
      ["o1", "o2", "o3", "o4"].forEach((o, i) => tl.fromTo("#s9 ." + o, { autoAlpha: 0, x: i % 2 ? 300 : -300 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "back.out(1.8)" }, t0 + 0.5 + i * 0.18));
      tl.fromTo("#s9 .cta", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.3 }, at("komm", -0.1));
      tl.fromTo("#s9 .cta", { scale: 1 }, { scale: 1.06, duration: 0.4, repeat: 4, yoyo: true, ease: "sine.inOut" }, at("komm", 0.3));
      const ringT0 = t0 + 0.4, D = E.T.duration - ringT0;
      tl.fromTo("#s9-arc", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": 352 }, duration: D, ease: "none" }, ringT0);
      const nEl = $("#s9-n");
      E.clock(tl, (t) => { nEl.textContent = String(Math.max(1, Math.min(6, 6 - Math.floor((t - ringT0) / (D / 6))))); });
      tl.fromTo("#s9 .ring", { autoAlpha: 0, scale: 0.5 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, ringT0);
    })();

    /* ---------- Engine: Szenen, Untertitel, HUD ---------- */
    E.buildScenes(tl);
    E.buildCaptions(tl);
    E.buildHud(tl);
    tl.set({}, {}, E.T.duration);

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  })();
  </script>
</body>
</html>
