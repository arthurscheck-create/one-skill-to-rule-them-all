  <script src="lib/cast.js"></script>
  <script>
  (function () {
    const E = window.Engine, at = E.at, end = E.end, cs = E.cs, svg = E.svg, D = E.T.duration;

    const HAIR = ["#5b3a22", "#2b1a12", "#c48a3a", "#1b1936", "#8a4a2a"];

      const r = E.rng(seed || 1);

        const w = svg("g", {}, g);
        E.person(w, { x, y, s, face: face || "neutral", arms: arms || "down", shirt: SHIRTS[Math.floor(r() * SHIRTS.length)], hair: HAIR[Math.floor(r() * HAIR.length)], long: r() < .45, flip: r() < .5 });

      const t = svg("text", { x: 0, y: sub ? -6 : fs * .36, "text-anchor": "middle", class: "lbl", "font-size": fs, fill: color }, b); t.textContent = text;
      if (sub) { const s = svg("text", { x: 0, y: h / 2 - 26, "text-anchor": "middle", class: "lbl", "font-size": 30, fill: "#fff" }, b); s.textContent = sub; }

    }
    const pop = (el, t, origin) => { tl.set(el, { autoAlpha: 0 }, 0); tl.fromTo(el, { autoAlpha: 1, scale: .3, svgOrigin: origin }, { scale: 1, duration: .35, ease: "back.out(2.6)", immediateRender: false }, t); };

    /* S1 Hook */

    E.globe($("#s1-earth"), { cx: 540, cy: 1980, r: 980, id: "e1", seed: 5 });
    const P1 = [];
    for (let i = 0; i < 9; i++) { const x = 110 + i * 107, y = 1980 - Math.sqrt(980 * 980 - (x - 540) * (x - 540)) + 8; P1.push([x, y, .34 + (i % 2) * .04, i % 3 ? "shock" : "happy"]); }
    crowd($("#s1-people"), P1, 11).forEach((w, i) => tl.fromTo(w, { y: 0 }, { y: -120, duration: .32, ease: "power2.out", yoyo: true, repeat: 9, immediateRender: false }, .1 + (i % 3) * .08));
    tl.fromTo("#s1 .title.main", { autoAlpha: 0, scale: .6 }, { autoAlpha: 1, scale: 1, duration: .3, ease: "back.out(2.4)" }, 0.1);
    tl.fromTo("#s1 .title.sub", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: .3 }, 0.7);
    tl.to(["#s1 .title.main", "#s1 .title.sub"], { autoAlpha: 0, duration: .15 }, at("loop", -0.15));

    /* S2 Mallorca füllt sich */

    for (let i = 0; i < 14; i++) svg("path", { d: `M${(i * 173) % 1000},${460 + (i * 97) % 900} q30,-20 60,0 q30,-20 60,0`, stroke: "#6fc3ff", "stroke-width": 6, fill: "none", opacity: .5 }, W2);
    const isl = $("#s2-island"), C2 = $("#s2-crowd"), r2 = E.rng(21), dots = [];
    while (dots.length < 520) { const x = 180 + r2() * 700, y = 480 + r2() * 600; const p = new DOMPoint(x, y); if (isl.isPointInFill(p)) dots.push(svg("circle", { cx: x, cy: y, r: 7, fill: SHIRTS[dots.length % SHIRTS.length], stroke: "#0d0b18", "stroke-width": 2 }, C2)); }
    dots.sort((a, b) => (+a.getAttribute("cx")) - (+b.getAttribute("cx")));
    tl.set(dots, { autoAlpha: 0 }, 0);
    tl.to(dots, { autoAlpha: 1, duration: .05, stagger: { each: Math.max(.002, (cs("mallorca", 5) - at("mallorca")) / dots.length) } }, at("mallorca", 0));
    const b2 = badge($("#s2-badge"), 540, 1135, "MALLORCA", "#ffd23f", 70, "≈ 2 MENSCHEN PRO m²");
    pop(b2, cs("mallorca", 5), "540 1135");
    tl.fromTo("#s2 .cam", { scale: 1.25 }, { scale: 1, duration: 2.5, ease: "power2.out", immediateRender: false }, at("treffen", -0.2));

    /* S3 Countdown */
    const P3 = [[160, 1360, .62], [380, 1330, .66], [600, 1370, .62], [820, 1340, .66], [270, 1480, .8], [700, 1500, .8], [960, 1480, .74], [40, 1500, .74]];
    crowd($("#s3-crowd"), P3.map((p) => [p[0], p[1], p[2], "worried"]), 31);
    ["#s3-n3", "#s3-n2", "#s3-n1"].forEach((id, i) => { tl.set(id, { autoAlpha: 0 }, 0); const t = cs("zaehlen", i); tl.fromTo(id, { autoAlpha: 1, scale: 1.8, svgOrigin: "540 660" }, { scale: 1, duration: .3, ease: "back.out(2)", immediateRender: false }, t); tl.set(id, { autoAlpha: 0 }, i < 2 ? cs("zaehlen", i + 1) : at("sprung", -0.15)); });

    for (let i = 0; i < 10; i++) { const x = 60 + i * 110; svg("line", { x1: x, y1: 1450, x2: x, y2: 1650 }, $("#s4-lines")); }

    tl.fromTo("#s4-lines", { y: 0, opacity: .8 }, { y: -500, opacity: 0, duration: .8, ease: "power1.out" }, at("sprung", -0.1));

    /* S5 Waage */
    E.stars($("#s5-stars"), 60, 51, 1200);
    const L = $("#s5-lpan"), R = $("#s5-rpan");
    const pan = (g, x) => { svg("path", { d: `M${x - 130},820 L${x},566 L${x + 130},820`, stroke: "#c9c3e6", "stroke-width": 6, fill: "none" }, g); svg("path", { d: `M${x - 160},820 L${x + 160},820 L${x + 120},860 L${x - 120},860Z`, fill: "#8a84b8", stroke: "#0d0b18", "stroke-width": 6 }, g); };
    pan(L, 260); pan(R, 820);
    const lc = svg("g", {}, L); for (let i = 0; i < 7; i++) E.person(lc, { x: 180 + i * 27, y: 818, s: .1, face: "happy", shirt: SHIRTS[i % 7] });
    const lt = svg("text", { x: 260, y: 930, "text-anchor": "middle", class: "lbl", "font-size": 46, fill: "#fff", stroke: "#0d0b18", "stroke-width": 9, "paint-order": "stroke" }, L); lt.textContent = "500 MIO. t";
    E.globe($("#s5-earth"), { cx: 820, cy: 690, r: 130, id: "e5", seed: 9 });
    const rt = svg("text", { x: 820, y: 930, "text-anchor": "middle", class: "lbl", "font-size": 42, fill: "#ffd23f", stroke: "#0d0b18", "stroke-width": 9, "paint-order": "stroke" }, R); rt.textContent = "× 12 BILLIONEN";

    tl.to("#s5-left", { y: -122, duration: .6, ease: "back.out(1.6)" }, tt);

    tl.fromTo(rt, { autoAlpha: 1, scale: .3, svgOrigin: "820 920" }, { scale: 1, duration: .35, ease: "back.out(2.5)", immediateRender: false }, cs("erde", 1, .2));

    [[0, 0, "#ff3b3b"], [30, 14, "#3fd4ff"], [-26, 18, "#ff3b3b"], [8, -28, "#3fd4ff"], [-10, 32, "#ff3b3b"], [26, -20, "#ff3b3b"], [-30, -14, "#3fd4ff"]].forEach(([dx, dy, c]) => svg("circle", { cx: 540 + dx, cy: 800 + dy, r: 30, fill: c, stroke: "#0d0b18", "stroke-width": 5 }, A));

    const seis = $("#s7-seis"); seis.setAttribute("d", d); const len = seis.getTotalLength(); seis.setAttribute("stroke-dasharray", len);

    for (let i = 0; i < 3; i++) { const e = svg("ellipse", { cx: 540, cy: 1420, rx: 60, ry: 16, opacity: 0 }, RG); tl.fromTo(e, { attr: { rx: 60, ry: 16 }, opacity: .9 }, { attr: { rx: 900, ry: 200 }, opacity: 0, duration: 1.2, ease: "power2.out", immediateRender: false }, cs("knall", 2, i * .25)); }
