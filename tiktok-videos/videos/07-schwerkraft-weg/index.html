  <script src="lib/cast.js"></script>
  <script>
  (function () {
    const E = window.Engine, at = E.at, end = E.end, cs = E.cs, svg = E.svg, D = E.T.duration;

    /* S1 */

    tl.fromTo("#s5-jumpwrap", { y: 0 }, { y: 30, duration: .2, repeat: 1, yoyo: true, ease: "sine.inOut" }, at("sek3", -0.2));
    tl.fromTo("#s5-jumpwrap", { y: 0, rotation: 0, svgOrigin: "300 1300" }, { y: -1080, rotation: 25, duration: Math.max(2.2, end("trampolin") - at("trampolin") + .8), ease: "power1.out", immediateRender: false }, at("trampolin", -0.1));

    /* S6 */
    E.skyline($("#s6-city"), { seed: 8, base: 1310, wMin: 100, wMax: 190, hMin: 220, hMax: 560, fill: "#7a8ac0", gap: 6 });
    const U6 = $("#s6-up"), r6 = E.rng(9);
    for (let i = 0; i < 14; i++) { const c = svg("ellipse", { cx: 520 + (r6() - .5) * 120, cy: 1300, rx: 10, ry: 16, fill: "#7fd0ff" }, U6); tl.fromTo(c, { y: 0, opacity: 1 }, { y: -900 - r6() * 300, x: (r6() - .5) * 300, opacity: .4, duration: 3, ease: "none" }, cs("alles", 0, i * .08)); }
    [[200, "#e8463c"], [860, "#ffd23f"], [700, "#3ee08f"]].forEach(([x, c], i) => { const b = svg("circle", { cx: x, cy: 1500, r: 44, fill: c, stroke: "#0d0b18", "stroke-width": 6 }, U6); tl.fromTo(b, { y: 0, rotation: 0, svgOrigin: `${x} 1500` }, { y: -1000, rotation: 180, duration: 3, ease: "power1.in" }, cs("alles", 1, i * .15)); });

    const D7 = $("#s7-down");
    [[200, "#e8463c", 44], [860, "#ffd23f", 44], [700, "#3ee08f", 44], [420, "#3fd4ff", 34]].forEach(([x, c, r], i) => { const b = svg("circle", { cx: x, cy: 600, r, fill: c, stroke: "#0d0b18", "stroke-width": 6 }, D7); tl.fromTo(b, { y: 0 }, { y: 1000 - r, duration: .7, ease: "power2.in" }, cs("zurueck", 0, i * .1)); tl.to(b, { y: 860 - r, duration: .25, ease: "power2.out", yoyo: true, repeat: 1 }, cs("zurueck", 0, .7 + i * .1)); });
