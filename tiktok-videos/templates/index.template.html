<!doctype html>
<html lang="de" data-resolution="portrait">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>__TITLE__</title>
  <link rel="stylesheet" href="lib/style.css" />
  <script src="lib/gsap.min.js"></script>
  <script src="timing.js"></script>
  <script src="lib/engine.js"></script>
  <style>
    #s1 .title.main { top: 1150px; font-size: 90px; line-height: 1.0; letter-spacing: -1px; }
    #s1 .title.sub { top: 1445px; font-size: 38px; color: var(--yellow); -webkit-text-stroke: 9px #0d0b18; }
    #s9 .q { position: absolute; top: 300px; left: 40px; right: 40px; text-align: center; font-weight: 900; font-size: 86px; line-height: 1.02; text-transform: uppercase; color: #fff; -webkit-text-stroke: 14px #0d0b18; paint-order: stroke fill; }
    #s9 .opt { position: absolute; left: 90px; right: 90px; height: 150px; border-radius: 22px; border: 5px solid; display: flex; align-items: center; padding: 0 34px; gap: 28px; font-weight: 900; text-transform: uppercase; }
    #s9 .opt .k { font-size: 70px; width: 70px; text-align: center; }
    #s9 .opt .t { font-size: 52px; color: #fff; line-height: 1.0; }
    #s9 .opt .t small { display: block; font-size: 24px; font-weight: 800; letter-spacing: 1px; opacity: .85; margin-top: 6px; }
    #s9 .o1 { top: 720px; border-color: #3fd4ff; background: rgba(8,40,60,.85); color: #3fd4ff; }
    #s9 .o2 { top: 930px; border-color: #3ee08f; background: rgba(6,40,24,.85); color: #3ee08f; }
    #s9 .o3 { top: 1140px; border-color: #ffd23f; background: rgba(46,36,4,.85); color: #ffd23f; }
    #s9 .o4 { top: 1240px; border-color: #ff3b3b; background: rgba(50,8,10,.85); color: #ff3b3b; }
    #s9 .cta { position: absolute; top: 1340px; left: 60px; right: 60px; text-align: center; font-weight: 900; font-size: 40px; line-height: 1.15; color: #3fd4ff; text-transform: uppercase; -webkit-text-stroke: 8px #0d0b18; paint-order: stroke fill; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="50" data-width="1080" data-height="1920">

    <!-- S1 · Hook (Szene + großer Titel in der Untertitel-Zone) -->
    <section class="scene" id="s1" data-drift="1.07"><div class="cam"><div class="drift">
      <svg class="art" viewBox="0 0 1080 1920">
        <rect width="1080" height="1920" fill="#2a2452"/>
        <g id="s1-kid"></g>
      </svg>
      <div class="title main">WAS WÄRE, WENN<br/><span class="r">SCHLÜSSELWORT</span><br/>PASSIERT?</div>
      <div class="title sub">⚠ UNTERZEILE MIT SPANNUNG</div>
    </div></div></section>

    <!-- S2 · Beispielszene: Figur + Requisit -->
    <section class="scene" id="s2"><div class="cam"><div class="drift">
      <svg class="art" viewBox="0 0 1080 1920">
        <rect width="1080" height="1200" fill="#3b2b63"/><rect y="1150" width="1080" height="770" fill="#34324a"/>
        <g id="s2-kid"></g>
      </svg>
    </div></div></section>

    <!-- S9 · CTA-Abstimmung -->
    <section class="scene" id="s9" data-punch="1.06" data-drift="1.0"><div class="cam"><div class="drift">
      <svg class="art" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#16142f"/></svg>
      <div class="q">FRAGE AN <span style="color:var(--yellow)">DICH</span>?</div>
      <div class="opt o1"><span class="k">A</span><span class="t">OPTION A<small>Kurzer Zusatz</small></span></div>
      <div class="opt o2"><span class="k">B</span><span class="t">OPTION B<small>Kurzer Zusatz</small></span></div>
      <div class="opt o3"><span class="k">C</span><span class="t">OPTION C<small>Kurzer Zusatz</small></span></div>
      <div class="cta">SCHREIB A, B ODER C<br/>IN DIE KOMMENTARE</div>
    </div></div></section>

    <!-- Overlays (nicht ändern) -->
    <div id="hud">
      <div class="hud-panel">
        <div class="hud-label"></div>
        <div class="hud-row"><span class="hud-num">000</span><span class="hud-unit"></span></div>
        <div class="hud-sub"></div>
        <div class="hud-delta"></div>
      </div>
      <div class="chip"><span class="chip-label"></span><span class="chip-val"></span></div>
    </div>
    <div id="captions"></div>
    <svg id="grain" width="1080" height="1920"><filter id="f-grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/></filter><rect width="1080" height="1920" filter="url(#f-grain)"/></svg>
    <div id="vignette"></div>
    <div id="flash"></div>
    <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="50" data-volume="0.9"></audio>
  </div>

  <script src="lib/cast.js"></script>
  <script>
  (function () {
    const E = window.Engine, at = E.at, end = E.end, svg = E.svg;
    const $ = (s) => document.querySelector(s);
    const tl = gsap.timeline({ paused: true });

    E.person($("#s1-kid"), { x: 540, y: 1500, s: 1.05, face: "shock", arms: "down" });
    E.person($("#s2-kid"), { x: 540, y: 1330, s: 1.0, face: "worried", arms: "phone" });
    tl.fromTo("#s1 .title.main", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 0.15);
    tl.fromTo("#s1 .title.sub", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 0.75);

    const t9 = at("cta", -0.3);
    tl.fromTo("#s9 .q", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, t9 + 0.05);
    ["o1", "o2", "o3"].forEach((o, i) => tl.fromTo("#s9 ." + o, { autoAlpha: 0, x: i % 2 ? 300 : -300 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "back.out(1.8)" }, t9 + 0.5 + i * 0.18));
    tl.fromTo("#s9 .cta", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.3 }, t9 + 1.4);

    E.buildScenes(tl);
    E.buildCaptions(tl);
    E.buildHud(tl);
    E.buildInteract(tl);
    tl.set({}, {}, E.T.duration);
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = tl;
    tl.seek(0);
  })();
  </script>
</body>
</html>
